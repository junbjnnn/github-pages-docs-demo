<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Component preview</title>
  <style>
    :root { --bg: #fff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; --accent: #8250df; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d; --accent: #ab7df8; } }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 720px; margin: 0 auto; padding: 40px 16px; }
    a { color: var(--accent); }
    .row { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
    .btn { font: inherit; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--accent); cursor: pointer; }
    .primary { background: var(--accent); color: #fff; }
    .ghost { background: transparent; color: var(--accent); }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <p><a href="styling/">← Về Styling</a></p>
  <h1>Component preview</h1>
  <p class="muted">Trang HTML tĩnh ở cấp 2: <code>docs/guides/frontend/component-preview.html</code>.</p>
  <div class="row">
    <button class="btn primary" type="button">Primary</button>
    <button class="btn ghost" type="button">Ghost</button>
  </div>
</main>
</body>
</html>

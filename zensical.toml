# Cấu hình Zensical. Source Markdown nằm ở docs/, output build ra docs-page/.
# Workflow .github/workflows/deploy-pages.yml build và push docs-page/ lên branch gh-pages.
# Không khai báo nav: scripts/generate-nav-from-docs-tree.py tự sinh sidebar từ cây docs/.
[project]
site_name = "Pages Docs Demo"
site_description = "Demo GitHub Pages build bằng Zensical, publish qua branch gh-pages"
site_url = "https://junbjnnn.github.io/github-pages-docs-demo/"
repo_url = "https://github.com/junbjnnn/github-pages-docs-demo"
repo_name = "junbjnnn/github-pages-docs-demo"
docs_dir = "docs"
site_dir = "docs-page"
extra_css = ["stylesheets/extra.css"]

[project.extra]
# Ẩn dòng "Made with Zensical" ở footer.
generator = false

[project.theme]
language = "vi"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Chuyển sang dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Chuyển sang light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
